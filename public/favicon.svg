<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="careq-grad-primary" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="careq-grad-cross" x1="14" y1="14" x2="34" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>
    <filter id="careq-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded Squircle Base -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#careq-grad-primary)" />
  <!-- Subtle inner border -->
  <rect x="2.5" y="2.5" width="43" height="43" rx="11.5" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" />
  
  <!-- Stylized Medical Cross with Pulse Wave -->
  <!-- Horizontal arm -->
  <rect x="12" y="20.5" width="24" height="7" rx="3.5" fill="url(#careq-grad-cross)" />
  <!-- Vertical arm -->
  <rect x="20.5" y="12" width="7" height="24" rx="3.5" fill="url(#careq-grad-cross)" />
  
  <!-- Pulse Line Accent -->
  <path d="M11 24h5l2.5-4 4 8 3.5-5 2 2h9" stroke="#0D9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- AI Spark / Node in upper right -->
  <circle cx="34" cy="14" r="3" fill="#38BDF8" filter="url(#careq-glow)" />
  <circle cx="34" cy="14" r="1.5" fill="#FFFFFF" />
</svg>