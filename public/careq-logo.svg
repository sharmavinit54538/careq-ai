<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 52" fill="none">
  <defs>
    <linearGradient id="logo-grad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="cross-grad" x1="14" y1="14" x2="34" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>
    <linearGradient id="ai-badge-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>
  
  <!-- Icon Mark (44x44) -->
  <g transform="translate(4, 4)">
    <rect width="44" height="44" rx="12" fill="url(#logo-grad)" />
    <rect x="0.5" y="0.5" width="43" height="43" rx="11.5" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1" />
    <rect x="11" y="19" width="22" height="6" rx="3" fill="url(#cross-grad)" />
    <rect x="19" y="11" width="6" height="22" rx="3" fill="url(#cross-grad)" />
    <path d="M10 22h4l2.5-3.5 3.5 7 3-4.5 2 1.5h8" stroke="#0D9488" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="33" cy="11" r="2.8" fill="#38BDF8" />
    <circle cx="33" cy="11" r="1.3" fill="#FFFFFF" />
  </g>

  <!-- Typography -->
  <text x="58" y="32" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="24" fill="#0F172A" letter-spacing="-0.5">Care<tspan fill="#0D9488">Q</tspan></text>
  
  <!-- AI Tag Badge -->
  <g transform="translate(138, 14)">
    <rect width="36" height="20" rx="5" fill="url(#ai-badge-grad)" />
    <text x="18" y="14.5" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.8">AI</text>
  </g>
</svg>
